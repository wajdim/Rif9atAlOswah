# رِفقة الأُسوة — مشروع iOS (يُولَّد ملف Xcode منه بـ XcodeGen)
#   brew install xcodegen
#   bash build/ios/sync-www.sh && cd build/ios && xcodegen generate && open Rifqa.xcodeproj
name: Rifqa
options:
  bundleIdPrefix: com.rifqa
  deploymentTarget:
    iOS: "15.0"          # iPhone 13 وما بعده (وأقدم حتى iPhone 6s)
  developmentLanguage: ar
settings:
  base:
    MARKETING_VERSION: "2.3.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
targets:
  Rifqa:
    type: application
    platform: iOS
    sources:
      - path: Rifqa
        excludes:
          - www
          - Info.plist
      - path: Rifqa/www
        type: folder        # يُنسخ المجلد كما هو داخل التطبيق
        buildPhase: resources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rifqa.aluswa
        PRODUCT_NAME: Rifqa
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Rifqa/Info.plist
        CODE_SIGN_STYLE: Automatic
        # ضع معرّف فريقك (Team ID) هنا أو اختره في Xcode ← Signing & Capabilities
        DEVELOPMENT_TEAM: ""
