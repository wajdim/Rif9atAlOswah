<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive guide to every screen and button of Rifqat al-Uswa.">
<link rel="icon" href="icon-192.png">
<title>Rifqat al-Uswa Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: guide header, 3-step quick start, then a two-column tour (phone mockup with numbered hotspots | explanation list), FAQ.
   Dark-first, using the app's own palette (pine, gold, parchment) and fonts (Amiri display, Tajawal body). */
:root{
  --bg:#141B17; --surface:#1B2520; --surface-2:#1F2A24; --ink:#E9E4D6; --ink-soft:#C8C1AE; --muted:#9A937F;
  --border:#2E3B34; --gold:#D2AE5C; --gold-wash:#2B2718; --pine:#7FB59A; --pine-soft:#22332A; --pine-strong:#BFE0CD;
  --clay:#E0A08F; --on-gold:#10170F; --phone:#0E1411;
  --display:"Amiri","Noto Naskh Arabic",Georgia,serif; --body:"Tajawal","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F7F2E4; --surface:#FFFDF6; --surface-2:#FBF6E9; --ink:#22312A; --ink-soft:#4A5850; --muted:#7A7362;
  --border:#E6DCBF; --gold:#A9822F; --gold-wash:#F3E7C9; --pine:#2F4C3E; --pine-soft:#E4EBE2; --pine-strong:#233A2F;
  --clay:#8C4A3B; --on-gold:#FFFDF6; --phone:#2A2620; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F7F2E4; --surface:#FFFDF6; --surface-2:#FBF6E9; --ink:#22312A; --ink-soft:#4A5850; --muted:#7A7362;
  --border:#E6DCBF; --gold:#A9822F; --gold-wash:#F3E7C9; --pine:#2F4C3E; --pine-soft:#E4EBE2; --pine-strong:#233A2F;
  --clay:#8C4A3B; --on-gold:#FFFDF6; --phone:#2A2620; color-scheme:light; }
*{box-sizing:border-box}
html[lang="ur"]{--display:"Noto Nastaliq Urdu","Urdu Typesetting","Noto Naskh Arabic",serif; --body:"Noto Nastaliq Urdu","Urdu Typesetting","Noto Naskh Arabic",system-ui,sans-serif}
html[lang="ur"] body{line-height:2.1}
html[lang="fa"]{--display:"Vazirmatn","Noto Naskh Arabic","Tahoma",serif; --body:"Vazirmatn","Noto Naskh Arabic","Tahoma",system-ui,sans-serif}
html[lang="bn"]{--display:"Noto Serif Bengali","Noto Sans Bengali","Nirmala UI","Vrinda",serif; --body:"Noto Sans Bengali","Hind Siliguri","Nirmala UI","Vrinda",system-ui,sans-serif}
html[lang="bn"] body{line-height:1.8}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--pine-strong)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.langs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:3px}
.langs button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:.85rem;color:var(--ink-soft);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:700}
.themeb{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;display:flex;gap:6px;align-items:center}

/* intro */
.intro{padding-block:28px 8px;max-width:720px}
h1{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.3;margin:0 0 8px;color:var(--pine-strong);text-wrap:balance}
.lead{color:var(--ink-soft);margin:0;font-size:1.05rem}
.ornament{display:flex;align-items:center;gap:8px;margin:18px 0 0;color:var(--gold)}
.ornament i{height:1px;flex:0 0 60px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{transform:scaleX(-1)}
.ornament b{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--gold)}
h2{font-family:var(--display);font-size:1.5rem;margin:40px 0 12px;color:var(--pine-strong)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;gap:4px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--gold);font-size:1.4rem;line-height:1}
.steps b{font-size:1.02rem}
.steps span{color:var(--ink-soft);font-size:.93rem}

/* tour */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--pine-soft);border-color:var(--pine);color:var(--pine-strong);font-weight:700}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 14px}
.tour{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.tour{grid-template-columns:minmax(0,1fr)}}
.phone-col{position:sticky;top:12px}
@media (max-width:760px){.phone-col{position:static}}
.phone{background:var(--phone);border-radius:34px;padding:10px;max-width:360px;margin-inline:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.screen{background:var(--bg);border-radius:26px;overflow:hidden;min-height:540px;max-height:640px;overflow-y:auto;position:relative;font-size:13px;line-height:1.6;scroll-behavior:smooth}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.m-brand{font-family:var(--display);font-weight:700;color:var(--pine);font-size:14px;white-space:nowrap}
.m-icons{display:flex;gap:3px}
.m-ic{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--ink-soft)}
.m-ic svg{width:14px;height:14px}
.m-body{padding:12px;display:grid;gap:10px}
.m-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px}
.m-h{font-family:var(--display);font-weight:700;color:var(--pine-strong);font-size:15px;line-height:1.4}
.m-muted{color:var(--muted);font-size:12px}
.m-ta{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:92px;color:var(--muted)}
.m-search{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;color:var(--muted)}
.m-btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px}
.m-btn svg{width:14px;height:14px}
.m-pri{background:var(--gold);color:var(--on-gold)}
.m-gh{border:1px solid var(--border);color:var(--ink-soft);font-weight:500}
.m-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.m-chip{border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface)}
.m-ar{font-family:var(--display);font-size:17px;color:var(--pine-strong);direction:rtl;text-align:right}
.m-badge{background:var(--pine-soft);color:var(--pine);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.m-sec{display:flex;gap:8px;align-items:center;font-weight:700}
.m-num{width:20px;height:20px;border-radius:50%;background:var(--gold-wash);color:var(--gold);display:grid;place-items:center;font-size:11px;flex:0 0 auto}
.m-seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.m-seg span{flex:1;text-align:center;padding:4px 2px;font-size:11px;color:var(--ink-soft)}
.m-seg span.on{background:var(--pine-soft);color:var(--pine-strong);font-weight:700}
.m-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.m-sel{border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;flex:1;min-width:0}
.m-stars{color:var(--gold);letter-spacing:2px}
.m-bar{position:absolute;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 10px 12px}
.m-prog{height:3px;background:var(--border);border-radius:3px;margin-bottom:8px}
.m-prog i{display:block;height:100%;width:38%;background:var(--gold);border-radius:3px}
.m-play{display:flex;align-items:center;gap:6px}
.m-pb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border)}
.m-pb.main{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.m-pb svg{width:14px;height:14px}
.dim{opacity:.35}

/* hotspots */
.hs{position:relative;cursor:pointer;border-radius:12px;transition:box-shadow .2s}
.hs::after{content:attr(data-n);position:absolute;top:-7px;inset-inline-end:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--on-gold);font:700 11px/18px var(--body);text-align:center;padding:0 4px;z-index:3;box-shadow:0 0 0 2px var(--bg)}
.hs.on{box-shadow:0 0 0 2px var(--gold),0 0 0 6px color-mix(in srgb,var(--gold) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.hs.on{animation:pulse 1.6s ease-out 1}}
@keyframes pulse{from{box-shadow:0 0 0 2px var(--gold),0 0 0 14px color-mix(in srgb,var(--gold) 0%,transparent)}}

/* list */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;text-align:start;width:100%}
.item .n{width:26px;height:26px;border-radius:50%;background:var(--gold-wash);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.item b{display:block;font-size:1rem}
.item span{color:var(--ink-soft);font-size:.93rem}
.item[aria-current="true"]{border-color:var(--gold);background:var(--surface-2)}
.item[aria-current="true"] .n{background:var(--gold);color:var(--on-gold)}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.stepper button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.stepper .count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

/* faq */
.faq{display:grid;gap:8px}
details{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--ink-soft)}
.note{margin-top:28px;border:1px solid var(--clay);border-radius:14px;padding:14px 16px;color:var(--ink-soft);font-size:.93rem}
.note b{color:var(--clay)}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:var(--pine)}
[dir="rtl"] .ornament i{transform:scaleX(-1)} [dir="rtl"] .ornament i:last-child{transform:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="brand" id="brand"></div>
    <div class="ctrls">
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
      <button class="themeb" id="themeBtn" type="button"></button>
    </div>
  </header>

  <section class="intro">
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div class="ornament" aria-hidden="true"><i></i><b></b><i></i></div>
  </section>

  <h2 id="quickH"></h2>
  <ol class="steps" id="steps"></ol>

  <h2 id="tourH"></h2>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="hint" id="hint"></p>
  <div class="tour">
    <div class="phone-col"><div class="phone"><div class="screen" id="screen"></div></div></div>
    <div>
      <ol class="list" id="list"></ol>
      <div class="stepper">
        <button type="button" id="prev"></button>
        <span class="count" id="count"></span>
        <button type="button" id="next"></button>
      </div>
    </div>
  </div>

  <h2 id="faqH"></h2>
  <div class="faq" id="faq"></div>
  <p class="note" id="note"></p>
  <footer class="foot" id="foot"></footer>
</div>

  faq:[["Does it need internet?","No. The analysis, library and all translations work offline. Internet is only used to stream a reciter's audio, to download a reciter, and for the optional AI."],["Is what I write saved or sent?","No. Your text stays on your phone and is not stored unless you save a result yourself. With an AI key, it goes directly to Anthropic, never to the developer."],["How do I listen without internet?","In the Android app: Settings → Reciter → Download. After that, verses play even in airplane mode."],["How do I switch back to light mode?","Settings → Appearance → Light (or Auto to follow your phone), then tap Save."],["Where do the translations come from?","Quran meanings from Tanzil.net (Saheeh International, Hamidullah, Siregar, Cortés, El-Hayek, Jalandhry, the Indonesian Ministry of Religious Affairs, Diyanet, Bubenheim & Elyas, Basmeih, Fooladvand, Muhiuddin Khan). Hadith translations other than English were prepared for the app from sunnah.com's English and are labelled. The Arabic is always the reference."]],
  m:{ph:"Write what happened in your own words… Who? What happened? How do you feel?",analyse:"Analyse my situation",ai:"AI deepening",chips:["Anger","Anxiety","Family"],daily:"Text of the day",dailyT:"For indeed, with hardship comes ease.",listenAll:"Listen to the full answer",openAll:"Open all",closeAll:"Close all",quote:"“My brother betrayed my trust and I don't know whether to forgive him.”",first:"A first reading of your situation",strong:"Strong match",firstTxt:"Your words are mostly about anger, within your relationship with your siblings…",closest:"The closest situation",sitT:"Yusuf and his brothers: “No blame upon you today”",src:"Al-Sharh 94:5",save:"Save",listen:"Listen",plan:"Practical plan",now:"Now",week:"This week",long:"Long term",planTxt:"Wait until you are calm before you reply.",rate:"Rate this answer",newSit:"New situation",copy:"Copy summary",share:"Share",exSearch:"Search a topic or situation…",byTopic:"By topic",allSit:"All situations (115)",topics:["Anger","Patience","Family"],topicSub:"8 situations · 6 verses",write:"Write about this topic",libSearch:"Search the texts…",filters:["All","Verses","Hadith","Supplications"],more:"Show more",savedH:"Saved",savedNote:"Kept on this device only",setH:"Settings",lang:"Language",theme:"Appearance",auto:"Auto",lightL:"Light",darkL:"Dark",size:"Text size",sizes:["S","M","L","XL"],v1:"Voice 1 — hadith",v2:"Voice 2 — narrator",tryL:"Try",speed:"Speed",speeds:["Slow","Normal","Fast"],reciter:"Reciter",reciterN:"Mahmoud Khalil Al-Husary",down:"Download (≈ 40 MB)",key:"Claude API key",cancel:"Cancel",saveB:"Save",playT:"Listen to the full answer",playS:"Part 3 of 14 · The closest situation"}

    top:[["Nom de l'application","Touchez-le depuis n'importe où pour revenir à l'accueil."],["Langue","Choisissez العربية, English, Français, Nederlands, Español, Português, اردو, Bahasa Indonesia, Türkçe, Deutsch, Bahasa Melayu, فارسی ou বাংলা. L'application se recharge dans cette langue et garde vos réglages."],["Explorer","Parcourez les 63 thèmes de vie et les 115 situations prophétiques."],["Bibliothèque","Chaque verset, hadith et invocation utilisés par l'application, avec leur source et leur degré."],["Enregistrés","Tout ce que vous avez enregistré. Gardé uniquement sur cet appareil."],["Réglages","Apparence, taille du texte, police, voix, récitateur et clé IA facultative."],["À propos","Comment l'application fonctionne, ce qui reste privé, et ses limites."]],
    home:[["Votre texte","Écrivez librement et en détail, jusqu'à 3 000 caractères. Rien de ce que vous écrivez n'est enregistré ni envoyé."],["Analyser ma situation","Repère les thèmes, les sentiments et les relations dans vos mots, puis propose la situation et les textes les plus proches."],["Approfondissement par IA","N'apparaît qu'après l'ajout de votre propre clé Claude dans les Réglages. Ajoute une réflexion écrite limitée aux textes trouvés."],["Raccourcis de thèmes","Un toucher ouvre directement la page d'un thème, sans écrire."],["Texte du jour","Un verset ou un hadith pour commencer la journée."]],

    player:[["Progression","Où en est la lecture."],["Précédent","Revient d'une partie."],["Lecture ou pause","Met en pause et reprend là où vous vous êtes arrêté."],["Suivant","Passe à la partie suivante."],["En cours","Le titre et la partie en cours."],["Vitesse","Touchez pour passer entre 1×, 1,2×, 1,45× et 0,8×."],["Arrêter","Termine la lecture et ferme le lecteur."]]
  },
  faq:[["Faut-il internet ?","Non. L'analyse, la bibliothèque et toutes les traductions fonctionnent hors ligne. Internet sert seulement à diffuser la voix d'un récitateur, à télécharger un récitateur, et pour l'IA facultative."],["Ce que j'écris est-il enregistré ou envoyé ?","Non. Votre texte reste sur votre téléphone et n'est enregistré que si vous enregistrez vous-même un résultat. Avec une clé IA, il va directement à Anthropic, jamais au développeur."],["Comment écouter sans internet ?","Dans l'application Android : Réglages → Récitateur → Télécharger. Ensuite, les versets se jouent même en mode avion."],["Comment revenir au mode clair ?","Réglages → Apparence → Clair (ou Automatique pour suivre le téléphone), puis Enregistrer."],["D'où viennent les traductions ?","Sens du Coran via Tanzil.net (Hamidullah en français). Les hadiths en français ont été traduits pour l'application à partir de l'anglais de sunnah.com, et c'est indiqué. L'arabe reste toujours la référence."]],

    lead:"صف ما تمرّ به بكلماتك، ويقرؤه التطبيق معك في ضوء القرآن الكريم والسنة النبوية والسيرة. يعرض هذا الدليل كل شاشة وكل زر.",
    quickH:"ابدأ في ثلاث خطوات",
    quick:[["اكتب","صف ما حدث، ومن المعنيّ، وبماذا تشعر. بالفصحى أو العامية أو بإحدى اللغات الثلاث عشرة."],["حلّل","اضغط «حلّل موقفي». يعمل التحليل على هاتفك دون إنترنت في نحو ثانية."],["اقرأ واستمع","افتح الأقسام، واحفظ ما ينفعك، أو اضغط «استمع إلى الإجابة كاملة»."]],

    tabs:["الشريط العلوي","الرئيسية","النتيجة","الموضوعات","المكتبة","المحفوظات","الإعدادات","مشغّل الصوت"],
    prev:"السابق", next:"التالي", of:"{0} من {1}", faqH:"أسئلة شائعة",
    dark:"داكن", light:"فاتح",
    note:"<b>تنبيه مهم.</b> التطبيق إرشادي تأملي، وليس فتوى ولا بديلًا عن عالم مؤهل أو طبيب أو مختص نفسي أو محامٍ. إذا كتبت عن خطر أو عنف أو إيذاء للنفس، يعرض لك التطبيق أولًا أين تجد المساعدة العاجلة.",
    foot:["سياسة الخصوصية","للتواصل: wajdi.chaouche@gmail.com"]},
  items:{
    top:[["اسم التطبيق","اضغطه من أي مكان للعودة إلى الصفحة الرئيسية."],["اللغة","اختر العربية أو English أو Français أو Nederlands أو Español أو Português أو اردو أو Bahasa Indonesia أو Türkçe أو Deutsch أو Bahasa Melayu أو فارسی أو বাংলা. يُعاد تحميل التطبيق بها مع بقاء إعداداتك."],["الموضوعات","تصفّح 63 موضوعًا حياتيًا و115 موقفًا نبويًا."],["المكتبة","كل آية وحديث ودعاء يعتمد عليه التطبيق، مع المصدر والدرجة."],["المحفوظات","كل ما حفظته، ويبقى على هذا الجهاز فقط."],["الإعدادات","المظهر وحجم الخط ونوعه والأصوات والقارئ ومفتاح الذكاء الاصطناعي الاختياري."],["عن التطبيق","كيف يعمل التطبيق، وما يبقى خاصًا، وحدوده."]],
    home:[["نصّك","اكتب بحرية وبالتفصيل حتى 3000 حرف. ما تكتبه لا يُحفظ ولا يُرسل."],["حلّل موقفي","يستخرج الموضوعات والمشاعر والعلاقات من كلامك، ويأتيك بأقرب موقف ونصوص."],["التعميق بالذكاء الاصطناعي","يظهر فقط بعد إضافة مفتاح Claude الخاص بك في الإعدادات، ويضيف تأملًا مكتوبًا مقيّدًا بالنصوص المسترجعة."],["اختصارات الموضوعات","ضغطة واحدة تفتح صفحة الموضوع مباشرة دون كتابة."],["نص اليوم","آية أو حديث تبدأ به يومك."]],
    result:[["استمع إلى الإجابة كاملة","يقرأ الإجابة كلها بصوت مسموع، وتُتلى الآيات بصوت القارئ الذي اخترته."],["فتح الأقسام أو طيّها","ويمكن طيّ كل قسم بالضغط على عنوانه."],["كلماتك","ما كتبته معروضًا في الأعلى لتتأكد أن القراءة تطابق قصدك."],["القراءة الأولى","الموضوع الأساسي، ومشاعرك مقتبسة بكلماتك، وموقعك في القصة (كأن تكون راعيًا، أو من وقع عليه الأذى، أو من أخطأ ويريد الإصلاح)، وما تحتاجه على الأرجح، ودرجة التطابق."],["الموقف الأقرب","موقف من السيرة أو من القرآن. اضغطه لقراءة القصة كاملة."],["الآيات والأحاديث","النص العربي والمعنى والمصدر والدرجة. «حفظ» للاحتفاظ به، ومكبّر الصوت للاستماع."],["الخطة العملية","خطوات للآن ولهذا الأسبوع وللمدى الطويل، تتنقل بينها بالألسنة الثلاثة."],["قيّم هذه الإجابة","نجوم وتعليق، أو إبلاغ عن مشكلة. يساعد ذلك على تحسين التطبيق."],["أزرار النتيجة","موقف جديد، نسخ الخلاصة، مشاركة، طباعة أو PDF (على الويب)، واستكشاف."]],
    explore:[["البحث","ابحث عن موضوع أو موقف بكلمة، مثل: الغضب، الديون، الوالدين."],["طريقتا عرض","حسب الموضوع، أو قائمة المواقف الـ115 كلها."],["بطاقة الموضوع","تفتح صفحة الموضوع: قراءة ومواقف وخطة وآيات وأحاديث وأدعية وأسئلة للتأمل."],["اكتب موقفك في هذا الموضوع","يعيدك إلى الرئيسية مع دعوة للكتابة في هذا الموضوع."]],
    library:[["البحث في النصوص","ابحث في كل آية وحديث ودعاء، بالعربية أو بلغتك."],["التصفية","اعرض الآيات أو الأحاديث أو الأدعية فقط، أو النصوص المرتبطة بموضوع."],["بطاقة النص","النص العربي والمعنى والمصدر ودرجة الصحة."],["أزرار البطاقة","احفظه، أو استمع إليه، أو انسخه مع مصدره."],["عرض المزيد","يحمّل النصوص التالية في القائمة."]],
    saved:[["عنصر محفوظ","اضغطه لفتح الموقف أو الآية أو الحديث من جديد."],["الإزالة","اضغط علامة الحفظ مرة أخرى لإزالته."],["على هذا الجهاز فقط","المحفوظات لا تُزامَن، وتُحذف عند مسح بيانات التطبيق."]],
    settings:[["المظهر","«تلقائي» يتبع هاتفك. الوضع الداكن هو الافتراضي منذ الإصدار 2.7."],["حجم الخط","صغير أو عادي أو كبير أو أكبر."],["نوع الخط","Andalus (الافتراضي) أو Tahoma أو Arial أو Times New Roman. يُطبَّق على كل النصوص، وتبقى الآيات القرآنية بخطها."],["صوتان","الصوت 1 (الشيخ) للأحاديث والأدعية، والصوت 2 (المحاور) للعناوين والشرح. اضغط «تجربة» لسماع كل منهما."],["سرعة القراءة","بطيئة أو عادية أو سريعة أو أسرع."],["القارئ","اختر أحد 26 قارئًا لتلاوة الآيات، واضغط «استماع» لعيّنة."],["التنزيل دون إنترنت (أندرويد)","يُنزّل التلاوات التي يستعملها التطبيق (15 إلى 65 ميغابايت). يمكن الإلغاء أو الحذف في أي وقت، وتظهر علامة ✓ بجانب القارئ المنزّل."],["مفتاح الذكاء الاصطناعي (اختياري)","مفتاح Claude API الخاص بك والنموذج. بدون مفتاح يعمل كل شيء دون إنترنت."],["حفظ أو إلغاء","لا تُطبَّق التغييرات إلا بعد الضغط على «حفظ»."]],
    player:[["التقدّم","إلى أين وصلت القراءة."],["السابق","يعود مقطعًا إلى الوراء."],["تشغيل أو إيقاف مؤقت","يوقف القراءة ويستأنفها من حيث توقفت."],["التالي","ينتقل إلى المقطع التالي."],["ما يُقرأ الآن","العنوان والمقطع الحالي."],["السرعة","اضغط للتبديل بين 1× و1.2× و1.45× و0.8×."],["إيقاف","ينهي القراءة ويغلق المشغّل."]]

  faq:[["এর জন্য কি ইন্টারনেট লাগে?","না। বিশ্লেষণ, লাইব্রেরি ও সব অনুবাদ ইন্টারনেট ছাড়াই চলে। ইন্টারনেট শুধু কারির কণ্ঠ স্ট্রিম করতে, কারি ডাউনলোড করতে এবং ঐচ্ছিক এআই-এর জন্য লাগে।"],["আমি যা লিখি তা কি সংরক্ষণ বা পাঠানো হয়?","না। আপনার লেখা আপনার ফোনেই থাকে এবং আপনি নিজে কোনো ফলাফল সংরক্ষণ না করলে রাখা হয় না। এআই কি থাকলে তা সরাসরি Anthropic-এ যায়, কখনো ডেভেলপারের কাছে নয়।"],["ইন্টারনেট ছাড়া কীভাবে শুনব?","অ্যান্ড্রয়েড অ্যাপে: সেটিংস → কারি → ডাউনলোড। এরপর বিমান মোডেও আয়াত চলে।"],["হালকা মোডে কীভাবে ফিরব?","সেটিংস → চেহারা → হালকা (বা ফোন অনুসরণ করতে স্বয়ংক্রিয়), তারপর “সংরক্ষণ” চাপুন।"],["অনুবাদগুলো কোথা থেকে?","কুরআনের বাংলা অর্থ Tanzil.net থেকে (মুহিউদ্দীন খান)। হাদিসের বাংলা অনুবাদ অ্যাপের জন্য sunnah.com-এর ইংরেজি থেকে প্রস্তুত এবং সেভাবে চিহ্নিত। মূল সূত্র সবসময় আরবি।"]],
  m:{ph:"নিজের ভাষায় লিখুন কী ঘটেছে… কে? কী হয়েছে? কেমন লাগছে?",analyse:"আমার পরিস্থিতি বিশ্লেষণ করুন",ai:"এআই দিয়ে গভীরতা",chips:["রাগ","দুশ্চিন্তা","পরিবার"],daily:"আজকের লেখা",dailyT:"নিশ্চয়ই কষ্টের সঙ্গে স্বস্তি আছে।",listenAll:"পুরো উত্তর শুনুন",openAll:"সব খুলুন",closeAll:"সব বন্ধ করুন",quote:"“আমার ভাই আমার বিশ্বাস ভেঙেছে আর জানি না তাকে ক্ষমা করব কি না।”",first:"আপনার পরিস্থিতির প্রথম পাঠ",strong:"জোরালো মিল",firstTxt:"আপনার কথা মূলত রাগ নিয়ে, ভাইবোনের সঙ্গে আপনার সম্পর্কের প্রেক্ষাপটে…",closest:"সবচেয়ে কাছের ঘটনা",sitT:"ইউসুফ ও তাঁর ভাইয়েরা: “আজ তোমাদের প্রতি কোনো তিরস্কার নেই”",src:"আশ-শারহ ৯৪:৫",save:"সংরক্ষণ",listen:"শুনুন",plan:"বাস্তব পরিকল্পনা",now:"এখন",week:"এই সপ্তাহ",long:"দীর্ঘমেয়াদে",planTxt:"উত্তর দেওয়ার আগে শান্ত হওয়া পর্যন্ত অপেক্ষা করুন।",rate:"এই উত্তরের মূল্যায়ন করুন",newSit:"নতুন পরিস্থিতি",copy:"সারাংশ কপি",share:"শেয়ার",exSearch:"বিষয় বা ঘটনা খুঁজুন…",byTopic:"বিষয় অনুযায়ী",allSit:"সব ঘটনা (১১৫)",topics:["রাগ","ধৈর্য","পরিবার"],topicSub:"৮টি ঘটনা · ৬টি আয়াত",write:"এই বিষয়ে লিখুন",libSearch:"লেখায় খুঁজুন…",filters:["সব","আয়াত","হাদিস","দোয়া"],more:"আরও দেখুন",savedH:"সংরক্ষিত",savedNote:"শুধু এই ডিভাইসে",setH:"সেটিংস",lang:"ভাষা",theme:"চেহারা",auto:"স্বয়ংক্রিয়",lightL:"হালকা",darkL:"গাঢ়",size:"লেখার আকার",sizes:["ছো","সা","ব","আব"],v1:"কণ্ঠ ১ — হাদিস",v2:"কণ্ঠ ২ — বর্ণনাকারী",tryL:"চেষ্টা করুন",speed:"গতি",speeds:["ধীর","সাধারণ","দ্রুত"],reciter:"কারি",reciterN:"মাহমুদ খলিল আল-হুসারি",down:"ডাউনলোড (≈ ৪০ এমবি)",key:"Claude API কি",cancel:"বাতিল",saveB:"সংরক্ষণ",playT:"পুরো উত্তর শুনুন",playS:"১৪-এর মধ্যে অংশ ৩ · সবচেয়ে কাছের ঘটনা"}
};

var ORDER = ["ar","en","fr","nl","es","pt","ur","id","tr","de","ms","fa","bn"];
var AYAH = "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا";

/* ------------------------------------------------------------------ mockup screens */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function hs(n, cls, inner, tag){ tag = tag || "div"; return "<" + tag + ' class="hs ' + (cls || "") + '" data-n="' + n + '" tabindex="0" role="button">' + inner + "</" + tag + ">"; }
function top(L, M, mark){
  var ic = ["globe","compass","book","mark","gear","info"];
  var icons = ic.map(function(k, i){ var h = '<span class="m-ic">' + IC[k] + "</span>"; return mark ? hs(i + 2, "", h, "span") : h; }).join("");
  var brand = '<span class="m-brand">' + esc(L.ui.brand) + "</span>";
  return '<div class="m-top">' + (mark ? hs(1, "", brand, "span") : brand) + '<span class="m-icons">' + icons + "</span></div>";
}
function seg(list, on){ return '<div class="m-seg">' + list.map(function(x, i){ return '<span class="' + (i === on ? "on" : "") + '">' + esc(x) + "</span>"; }).join("") + "</div>"; }
function verseCard(M, n){
  var inner = '<div class="m-ar">' + AYAH + "</div>" + (M.dailyT ? '<div style="margin-top:4px">' + esc(M.dailyT) + "</div>" : "") +
    '<div class="m-muted" style="margin-top:4px">' + esc(M.src) + "</div>";
  return inner;
}
var SCREENS = {
  top: function(L, M){ return top(L, M, true) + '<div class="m-body dim"><div class="m-h" style="text-align:center;font-size:20px">' + esc(L.ui.brand) + '</div><div class="m-ta">' + esc(M.ph) + '</div><div><span class="m-btn m-pri">' + esc(M.analyse) + "</span></div></div>"; },
  home: function(L, M){
    return top(L, M) + '<div class="m-body"><div class="m-h" style="text-align:center;font-size:20px">' + esc(L.ui.brand) + "</div>" +
      hs(1, "m-ta", esc(M.ph)) +
      '<div class="m-row" style="justify-content:space-between">' + hs(3, "m-row", '<span class="m-chip">⏺</span><span class="m-muted">' + esc(M.ai) + "</span>") + hs(2, "m-btn m-pri", esc(M.analyse), "span") + "</div>" +
      hs(4, "m-row", M.chips.map(function(c){ return '<span class="m-chip">' + esc(c) + "</span>"; }).join("")) +
      hs(5, "m-card", '<div class="m-muted">' + esc(M.daily) + "</div>" + verseCard(M)) + "</div>";
  },
  result: function(L, M){
    return top(L, M) + '<div class="m-body">' +
      hs(1, "m-btn m-pri", IC.speak + esc(M.listenAll), "span") +
      hs(2, "m-row", '<span class="m-btn m-gh">' + esc(M.openAll) + '</span><span class="m-btn m-gh">' + esc(M.closeAll) + "</span>") +
      hs(3, "m-card", '<em class="m-muted" style="font-style:normal">' + esc(M.quote) + "</em>") +
      hs(4, "m-card", '<div class="m-row" style="justify-content:space-between"><b>' + esc(M.first) + '</b><span class="m-badge">' + esc(M.strong) + '</span></div><div class="m-muted">' + esc(M.firstTxt) + "</div>") +
      hs(5, "m-card", '<div class="m-sec"><span class="m-num">2</span>' + esc(M.closest) + '</div><div class="m-h" style="margin-top:6px">' + esc(M.sitT) + "</div>") +
      hs(6, "m-card", verseCard(M) + '<div class="m-row" style="margin-top:6px"><span class="m-btn m-gh">' + IC.mark + esc(M.save) + '</span><span class="m-btn m-gh">' + IC.speak + esc(M.listen) + "</span></div>") +
      hs(7, "m-card", '<div class="m-sec" style="margin-bottom:6px"><span class="m-num">8</span>' + esc(M.plan) + "</div>" + seg([M.now, M.week, M.long], 0) + '<div class="m-muted" style="margin-top:6px">✓ ' + esc(M.planTxt) + "</div>") +
      hs(8, "m-card", "<b>" + esc(M.rate) + '</b><div class="m-stars">★★★★☆</div>') +
      hs(9, "m-row", '<span class="m-btn m-gh">' + esc(M.newSit) + '</span><span class="m-btn m-gh">' + esc(M.copy) + '</span><span class="m-btn m-gh">' + esc(M.share) + "</span>") + "</div>";
  },
  explore: function(L, M){
    return top(L, M) + '<div class="m-body">' + hs(1, "m-search", esc(M.exSearch)) +
      hs(2, "m-row", '<span class="m-chip" style="background:var(--pine-soft);color:var(--pine-strong)">' + esc(M.byTopic) + '</span><span class="m-chip">' + esc(M.allSit) + "</span>") +
      hs(3, "m-card", '<div class="m-h">' + esc(M.topics[0]) + '</div><div class="m-muted">' + esc(M.topicSub) + "</div>") +
      '<div class="m-card"><div class="m-h">' + esc(M.topics[1]) + '</div><div class="m-muted">' + esc(M.topicSub) + "</div></div>" +
      "<div>" + hs(4, "m-btn m-pri", esc(M.write), "span") + "</div></div>";
  },
  library: function(L, M){
    var card = '<div class="m-ar">' + AYAH + '</div><div class="m-muted">' + esc(M.src) + "</div>";
    return top(L, M) + '<div class="m-body">' + hs(1, "m-search", esc(M.libSearch)) +
      hs(2, "m-row", M.filters.map(function(f, i){ return '<span class="m-chip"' + (i ? "" : ' style="background:var(--pine-soft);color:var(--pine-strong)"') + ">" + esc(f) + "</span>"; }).join("")) +
      hs(3, "m-card", card + (M.dailyT ? '<div style="margin-top:4px">' + esc(M.dailyT) + "</div>" : "")) +
      hs(4, "m-row", '<span class="m-btn m-gh">' + IC.mark + esc(M.save) + '</span><span class="m-btn m-gh">' + IC.speak + esc(M.listen) + '</span><span class="m-btn m-gh">' + esc(M.copy) + "</span>") +
      '<div class="m-card dim">' + card + "</div>" +
      "<div>" + hs(5, "m-btn m-gh", esc(M.more), "span") + "</div></div>";
  },
  saved: function(L, M){
    return top(L, M) + '<div class="m-body"><div class="m-h">' + esc(M.savedH) + "</div>" +
      hs(1, "m-card", '<div class="m-h">' + esc(M.sitT) + '</div><div class="m-muted">' + esc(M.closest) + "</div>") +
      '<div class="m-card m-row" style="justify-content:space-between"><div style="min-width:0">' + verseCard(M) + "</div>" + hs(2, "m-ic", IC.mark, "span") + "</div>" +
      hs(3, "m-muted", "🔒 " + esc(M.savedNote)) + "</div>";
  },
  settings: function(L, M){
    function grp(lbl, body){ return '<div class="m-label">' + esc(lbl) + "</div>" + body; }
    return top(L, M) + '<div class="m-body"><div class="m-h">' + esc(M.setH) + "</div>" +
      hs(1, "", grp(M.theme, seg([M.auto, M.lightL, M.darkL], 2))) +
      hs(2, "", grp(M.size, seg(M.sizes, 1))) +
      hs(3, "", grp(L.items.settings[2][0], seg(["Andalus","Tahoma","Arial","Times"], 0))) +
      hs(4, "", grp(M.v1, '<div class="m-row"><span class="m-sel">—</span><span class="m-btn m-gh">' + esc(M.tryL) + "</span></div>") + '<div style="height:6px"></div>' + grp(M.v2, '<div class="m-row"><span class="m-sel">—</span><span class="m-btn m-gh">' + esc(M.tryL) + "</span></div>")) +
      hs(5, "", grp(M.speed, seg(M.speeds, 1))) +
      hs(6, "", grp(M.reciter, '<div class="m-row"><span class="m-sel">' + esc(M.reciterN) + '</span><span class="m-btn m-gh">' + esc(M.listen) + "</span></div>")) +
      hs(7, "m-btn m-gh", IC.down + esc(M.down), "span") +
      hs(8, "", grp(M.key, '<div class="m-sel">sk-ant-…</div>')) +
      hs(9, "m-row", '<span class="m-btn m-gh">' + esc(M.cancel) + '</span><span class="m-btn m-pri">' + esc(M.saveB) + "</span>") + "</div>";
  },
  player: function(L, M){
    return top(L, M) + '<div class="m-body dim" style="padding-bottom:120px"><div class="m-card">' + verseCard(M) + '</div><div class="m-card"><div class="m-h">' + esc(M.sitT) + "</div></div></div>" +
      '<div class="m-bar">' + hs(1, "m-prog", "<i></i>") +
      '<div class="m-play">' + hs(2, "m-pb", IC.prev, "span") + hs(3, "m-pb main", IC.pause, "span") + hs(4, "m-pb", IC.next, "span") +
      hs(5, "", '<div style="font-weight:700;font-size:12px">' + esc(M.playT) + '</div><div class="m-muted" style="font-size:11px">' + esc(M.playS) + "</div>") +
      hs(6, "m-pb", '<span style="font-size:11px;font-weight:700">1×</span>', "span") + hs(7, "m-pb", IC.stop, "span") + "</div></div>";
  }
};

/* ------------------------------------------------------------------ state + render */
var cur = "fr", tab = "top", idx = 0;
function load(k, d){ try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
var nav = (navigator.language || "en").slice(0, 2);
cur = load("rg.lang", ORDER.indexOf(nav) > -1 ? nav : "en");
var theme = load("rg.theme", "dark");
var h = (location.hash || "").slice(1); if (TABS.indexOf(h) > -1) tab = h;
var $ = function(id){ return document.getElementById(id); };
function fmt(s){ var a = arguments; return s.replace(/\{(\d)\}/g, function(m, i){ return a[+i + 1]; }); }

function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  var L = G[cur];
  $("themeBtn").innerHTML = (theme === "dark" ? IC.sun + esc(L.ui.light) : IC.moon + esc(L.ui.dark));
}
function renderAll(){
  var L = G[cur];
  document.documentElement.lang = cur; document.documentElement.dir = L.dir;
  $("brand").innerHTML = esc(L.ui.brand) + "<small>" + esc(L.ui.sub) + "</small>";
  $("langs").innerHTML = ORDER.map(function(k){ return '<button type="button" lang="' + k + '" data-l="' + k + '" aria-pressed="' + (k === cur) + '">' + esc(G[k].name) + "</button>"; }).join("");
  $("h1").textContent = L.ui.h1; $("lead").textContent = L.ui.lead;
  $("quickH").textContent = L.ui.quickH;
  $("steps").innerHTML = L.ui.quick.map(function(q){ return "<li><b>" + esc(q[0]) + "</b><span>" + esc(q[1]) + "</span></li>"; }).join("");
  $("tourH").textContent = L.ui.tourH; $("hint").textContent = L.ui.hint;
  $("tabs").innerHTML = TABS.map(function(t, i){ return '<button type="button" role="tab" data-t="' + t + '" aria-selected="' + (t === tab) + '">' + esc(L.ui.tabs[i]) + "</button>"; }).join("");
  $("prev").textContent = (L.dir === "rtl" ? "→ " : "← ") + L.ui.prev; $("next").textContent = L.ui.next + (L.dir === "rtl" ? " ←" : " →");
  $("faqH").textContent = L.ui.faqH;
  $("faq").innerHTML = L.faq.map(function(f){ return "<details><summary>" + esc(f[0]) + "</summary><p>" + esc(f[1]) + "</p></details>"; }).join("");
  $("note").innerHTML = L.ui.note;
  $("foot").innerHTML = '<a href="https://wajdim.github.io/Rif9atAlOswah/privacy.html' + (cur === "en" ? "" : "#" + cur) + '" target="_blank" rel="noopener">' + esc(L.ui.foot[0]) + "</a><span>" + esc(L.ui.foot[1]) + "</span><span>Rifqat al-Uswa 2.8</span>";
  document.title = L.ui.brand + " · " + L.ui.sub.split("·")[0].trim();
  applyTheme(); renderTour();
}
function renderTour(){
  var L = G[cur], M = L.m, items = L.items[tab];
  $("screen").innerHTML = SCREENS[tab](L, M);
  $("screen").scrollTop = 0;
  $("list").innerHTML = items.map(function(it, i){ return '<li><button type="button" class="item" data-i="' + i + '"><span class="n">' + (i + 1) + "</span><span><b>" + esc(it[0]) + "</b><span>" + esc(it[1]) + "</span></span></button></li>"; }).join("");
  Array.prototype.forEach.call($("tabs").children, function(b){ b.setAttribute("aria-selected", b.getAttribute("data-t") === tab); });
  select(Math.min(idx, items.length - 1), false);
}
function select(i, scroll){
  var items = G[cur].items[tab]; idx = Math.max(0, Math.min(items.length - 1, i));
  $("screen").querySelectorAll(".hs").forEach(function(el){ el.classList.toggle("on", +el.getAttribute("data-n") === idx + 1); });
  $("list").querySelectorAll(".item").forEach(function(el){ el.setAttribute("aria-current", +el.getAttribute("data-i") === idx); });
  $("count").textContent = fmt(G[cur].ui.of, idx + 1, items.length);
  if (scroll) {
    var el = $("screen").querySelector('.hs[data-n="' + (idx + 1) + '"]'); var sc = $("screen");
    if (el) { var r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(); if (r.top < s.top + 50 || r.bottom > s.bottom) sc.scrollTop += r.top - s.top - 70; }
  }
}
function goTab(t){ tab = t; idx = 0; try { history.replaceState(null, "", "#" + t); } catch (e) {} renderTour(); }

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-l]"); if (b) { cur = b.getAttribute("data-l"); store("rg.lang", cur); renderAll(); return; }
  b = e.target.closest("[data-t]"); if (b) { goTab(b.getAttribute("data-t")); return; }
  b = e.target.closest(".item"); if (b) { select(+b.getAttribute("data-i"), true); return; }
  b = e.target.closest(".hs"); if (b) { select(+b.getAttribute("data-n") - 1, false); var li = $("list").querySelector('[data-i="' + idx + '"]'); if (li && window.innerWidth <= 760) li.scrollIntoView({block:"nearest", behavior:"smooth"}); return; }
  if (e.target.closest("#themeBtn")) { theme = theme === "dark" ? "light" : "dark"; store("rg.theme", theme); applyTheme(); return; }
  if (e.target.closest("#prev")) { stepBy(-1); return; }
  if (e.target.closest("#next")) { stepBy(1); return; }
});
function stepBy(d){
  var n = G[cur].items[tab].length, ti = TABS.indexOf(tab);
  if (idx + d >= n && ti < TABS.length - 1) { goTab(TABS[ti + 1]); return; }
  if (idx + d < 0 && ti > 0) { tab = TABS[ti - 1]; idx = G[cur].items[tab].length - 1; renderTour(); return; }
  select(idx + d, true);
}
document.addEventListener("keydown", function(e){
  if (e.target.closest && e.target.closest(".hs") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.click(); return; }
  if (/input|textarea/i.test(e.target.tagName)) return;
  var rtl = G[cur].dir === "rtl";
  if (e.key === "ArrowRight") stepBy(rtl ? -1 : 1); else if (e.key === "ArrowLeft") stepBy(rtl ? 1 : -1);
});
renderAll();
})();
</script>
